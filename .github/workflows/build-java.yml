# =============================================================================
# Centralized CI/CD Workflow: Java / Spring Boot Microservices
# =============================================================================
# Architecture:
# - Stage 1 (Quality Gate): Runs on Pull Request & Push.
#   Performs Secret Scan, Lint & Compile, Unit & Integration Tests, Coverage.
# - Stage 2 (Dockerize & Deploy): ONLY runs on Push (Merge) or Release Tag.
#   Builds executable JAR, Docker image, pushes to GAR and triggers GKE GitOps.
# =============================================================================

name: "Centralized CI/CD: Java Service"

on:
  workflow_call:
    inputs:
      service_name:
        description: "Service name (e.g. api-gateway, auth-service, order-service)"
        required: true
        type: string
      image_name:
        description: "Docker image name override (defaults to service_name)"
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "./Dockerfile"
      platform:
        description: "Target CPU architecture platform"
        required: false
        type: string
        default: "linux/amd64"
      java_version:
        description: "JDK version"
        required: false
        type: string
        default: "17"
      checkout_repo:
        description: "Repository to checkout (owner/repo)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      extra_maven_args:
        description: "Additional Maven arguments for packaging"
        required: false
        type: string
        default: ""
      run_secret_scan:
        description: "Run secret scanning"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run unit & integration tests"
        required: false
        type: boolean
        default: true
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: lithe-paratext-506208-s5
  GAR_LOCATION: asia-southeast1
  REPOSITORY: delivery-repo

jobs:
  # ===========================================================================
  # Stage 1: Quality Gate (Chạy khi tạo PR / MR & khi Push)
  # ===========================================================================
  quality-gate:
    name: "Stage 1: Quality Gate (Security, Lint, Test, Coverage)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Secret Scan (Credential & Key Detection)
        if: inputs.run_secret_scan
        run: |
          echo "🔍 Scanning commit for hardcoded secrets, API keys, and private credentials..."
          SUSPICIOUS=$(git grep -EI '(AIza[0-9A-Za-z-_]{35}|ghp_[0-9A-Za-z]{36}|-----BEGIN (RSA|EC|DSA|OPENSSH|PRIVATE) KEY-----)' -- ':!*.lock' ':!pom.xml' ':!target' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "❌ Suspicious secret pattern detected in repository:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "✅ Secret scan passed: No leaked credentials found."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Platform Dependencies (contracts, starters)
        run: |
          echo "Resolving platform dependencies (BOM, build-parent, contracts, starters)..."
          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.starters.git /tmp/starters
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-platform-bom/pom.xml
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-build-parent/pom.xml

          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.contracts.git /tmp/contracts
          mvn -B -DskipTests install -f /tmp/contracts/pom.xml

          mvn -B -DskipTests install -f /tmp/starters/pom.xml
          echo "✅ Platform dependencies ready."

      - name: Compile and Lint Check
        run: |
          echo "🛠️ Compiling all source modules and test classes..."
          mvn -B test-compile

      - name: Run Unit & Integration Tests
        if: inputs.run_tests
        run: |
          echo "🧪 Running unit & integration tests..."
          mvn -B test -DfailIfNoTests=false

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name || 'service' }}-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            **/target/jacoco.exec
          if-no-files-found: ignore

  # ===========================================================================
  # Stage 2: Dockerize & Deploy (CHỈ CHẠY KHI MERGE VÀO NHÁNH HOẶC TẠO TAG)
  # ===========================================================================
  dockerize-and-deploy:
    name: "Stage 2: Post-Merge (Build JAR, Push GAR & Deploy GKE)"
    needs: [quality-gate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repo || github.repository }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Platform Dependencies
        run: |
          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.starters.git /tmp/starters
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-platform-bom/pom.xml
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-build-parent/pom.xml

          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.contracts.git /tmp/contracts
          mvn -B -DskipTests install -f /tmp/contracts/pom.xml

          mvn -B -DskipTests install -f /tmp/starters/pom.xml

      - name: Package Service Jar
        run: |
          if [ -f "scripts/package-compose-services.sh" ]; then
            bash scripts/package-compose-services.sh ${{ inputs.service_name }} ${{ inputs.extra_maven_args }}
          else
            mvn -B -DskipTests clean package ${{ inputs.extra_maven_args }}
            mkdir -p target
            JAR_FILE=$(find . -type f \( -name "*boot*.jar" -o -name "*service*.jar" -o -name "*.jar" \) ! -name "*sources*" ! -name "*javadoc*" ! -name "*.jar.original" -path "*/target/*" | head -n 1)
            if [ -n "$JAR_FILE" ]; then
              echo "Found executable jar: $JAR_FILE -> copying to target/app.jar"
              cp "$JAR_FILE" target/app.jar
            fi
          fi

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        id: docker_build
        env:
          SERVICE: ${{ inputs.service_name }}
          TARGET_IMAGE: ${{ inputs.image_name || inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
          PLATFORM: ${{ inputs.platform }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          canonical="${SERVICE%-service}"
          if [ "$SERVICE" = "saga-orchestrator-service" ]; then
            canonical="dispatch"
          fi

          if [ -f "${canonical}/boot/pom.xml" ] && [ -d "${canonical}/boot/src" ]; then
            SERVICE_PATH="${canonical}/boot"
          elif [ -f "${SERVICE}/pom.xml" ] && [ -d "${SERVICE}/src" ]; then
            SERVICE_PATH="${SERVICE}"
          else
            SERVICE_PATH="${SERVICE}"
          fi

          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${TARGET_IMAGE}"

          # Determine tags based on branch or release tag
          TAG_ARGS=()
          TARGET_ENV=""
          DEPLOY_TAG=""

          if [ "$REF_TYPE" = "tag" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "🏷️ Release tag detected: ${REF_NAME}"
            TAG_ARGS+=("-t" "${IMAGE_URI}:${REF_NAME}")
            TAG_ARGS+=("-t" "${IMAGE_URI}:latest")
            TARGET_ENV="production"
            DEPLOY_TAG="${REF_NAME}"
          elif [ "$REF_NAME" = "staging" ]; then
            echo "🧪 Staging branch build detected"
            TAG_ARGS+=("-t" "${IMAGE_URI}:staging-${IMAGE_TAG}")
            TAG_ARGS+=("-t" "${IMAGE_URI}:staging")
            TARGET_ENV="staging"
            DEPLOY_TAG="staging-${IMAGE_TAG}"
          else
            echo "📦 Main/Feature branch build detected"
            TAG_ARGS+=("-t" "${IMAGE_URI}:${IMAGE_TAG}")
            TAG_ARGS+=("-t" "${IMAGE_URI}:latest")
            TARGET_ENV="staging"
            DEPLOY_TAG="${IMAGE_TAG}"
          fi

          docker buildx build \
            --platform "${PLATFORM}" \
            --build-arg SERVICE_PATH="${SERVICE_PATH}" \
            "${TAG_ARGS[@]}" \
            -f "${DOCKERFILE}" \
            --push .

          echo "✅ Successfully built & pushed image with tags:"
          for t in "${TAG_ARGS[@]}"; do
            echo "   $t"
          done

          echo "target_env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT

      - name: Trigger GitOps CD Deployment
        if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_IMAGE: ${{ inputs.image_name || inputs.service_name }}
          TARGET_ENV: ${{ steps.docker_build.outputs.target_env }}
          DEPLOY_TAG: ${{ steps.docker_build.outputs.deploy_tag }}
        run: |
          echo "🚀 Dispatching GitOps deployment: ${TARGET_IMAGE} (${DEPLOY_TAG}) -> ${TARGET_ENV}"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/hoanganhnth23/delivery.devops.gitops/dispatches \
            -d "{\"event_type\": \"deploy_service\", \"client_payload\": {\"environment\": \"${TARGET_ENV}\", \"service_name\": \"${TARGET_IMAGE}\", \"image_tag\": \"${DEPLOY_TAG}\"}}" || echo "GitOps dispatch completed"
