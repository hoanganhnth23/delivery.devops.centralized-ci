# =============================================================================
# Reusable CI Workflow: Java Quality Gate (Lint, Test, Security Scan)
# =============================================================================
# Runs quality checks without building Docker images.
# Used for Pull Request / Merge Request validation and pre-merge checks.
# =============================================================================

name: "CI: Java Quality Gate"

on:
  workflow_call:
    inputs:
      java_version:
        description: "JDK version"
        required: false
        type: string
        default: "17"
      service_name:
        description: "Service name"
        required: false
        type: string
        default: ""
      run_secret_scan:
        description: "Run secret scanning"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run unit & integration tests"
        required: false
        type: boolean
        default: true
    secrets:
      GCP_SA_KEY:
        required: false

jobs:
  quality-gate:
    name: "Quality Gate (Lint, Test & Security)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Secret Scan (Credential Detection)
        if: inputs.run_secret_scan
        run: |
          echo "🔍 Scanning repository for hardcoded secrets, keys, and tokens..."
          SUSPICIOUS=$(git grep -EI '(AIza[0-9A-Za-z-_]{35}|ghp_[0-9A-Za-z]{36}|-----BEGIN (RSA|EC|DSA|OPENSSH|PRIVATE) KEY-----)' -- ':!*.lock' ':!pom.xml' ':!target' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "❌ Suspicious secret pattern detected in repository:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "✅ Secret scan passed: No leaked credentials found."

      - name: Authenticate to Google Cloud (for GAR Artifacts)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Platform Dependencies (contracts, starters)
        run: |
          echo "Resolving platform dependencies (BOM, build-parent, contracts, starters)..."
          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.starters.git /tmp/starters
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-platform-bom/pom.xml
          mvn -B -DskipTests install -f /tmp/starters/platform/delivery-build-parent/pom.xml

          git clone --depth=1 https://github.com/hoanganhnth23/delivery.core.contracts.git /tmp/contracts
          mvn -B -DskipTests install -f /tmp/contracts/pom.xml

          mvn -B -DskipTests install -f /tmp/starters/pom.xml
          echo "✅ Platform dependencies ready."

      - name: Compile and Lint Check
        run: |
          echo "🛠️ Compiling all source modules and test classes..."
          mvn -B test-compile

      - name: Run Unit & Integration Tests
        if: inputs.run_tests
        run: |
          echo "🧪 Running unit & integration tests..."
          mvn -B test -DfailIfNoTests=false

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_name || 'service' }}-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            **/target/jacoco.exec
          if-no-files-found: ignore
